<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17</title>
</head>
<body>
    <!-- Assignment 17: Form Attributes and Input Validation -->
     <form action="submit.php" method="post" >
        <label for="username"></label>
        <input type="text" id="username" name="username" placeholder="Full Name" required>
        <br></br>
        <label for="email"></label>
        <input type="email" id="email" name="email" placeholder="your@college.edu" required>
        <br></br>
        <label for="mobile"></label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
        <br></br>
        <label for="password"></label>
        <input type="password" id="password" name="password" placeholder="6 min characters" minlength="6" required>
        <br></br>
        <label for="age"></label>
        <input type="number" id="age" name="age" placeholder="Age(17-30)" min="17" max="30" required>
        <br></br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
